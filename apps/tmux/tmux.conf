# See: <https://superuser.com/a/583502>
set -g default-command "${SHELL}"
# Term
set -g default-terminal "xterm-ghostty"
# History
set -g history-limit 10000
# Window numbers from 1, not from 0, renumber if closed
set -g base-index 1
set-option -g renumber-windows on
# Quick Escape (for vim)
set -s escape-time 0
set -g mouse on
set-option -g status-keys vi
set-option -g set-titles on
set-option -g set-titles-string 'tmux - #W'
set -g bell-action any
set-option -g visual-bell off
setw -g mode-keys vi

# Theme: derived from Ghostty's active theme, so tmux follows whatever theme
# Ghostty uses (built-in or custom) including the light/dark switch.
# Mapping: themeblack=background, themewhite=foreground, themedark-grey=10%
# surface, themelight-grey=dim text, remaining accents from palette 1-6.
# See tools/ghostty-tmux-theme.py.
set -g theme detect
run-shell '~/.shell/tools/ghostty-tmux-theme.py'

# Statusbar
set -g status-position top
set -g status-style 'bg=themedarkgrey,fg=themewhite'
set -g status-justify centre
set -g status-left-length 20
# ¡ ™ £ ¢ ∞ § ¶ • ª º – ≠ œ ∑ á ® † ¥ ä â ø π “ ‘ å ß ∂ ƒ © ˙ ∆ ˚ ¬ … æ Ω ≈ ç √ ∫ ã µ ≤ ≥ ÷
set -g status-left ' Ω #S'
set -g status-right-length 20
set -g status-right ' ∂ ß Ω π • #[fg=themeyellow]%H:%M '
# set -g status-right "#(echo '∂ ß Ω π ' | fold -w2 | shuf -n4 | tr -d '\n')• #[fg=yellow]%H:%M "
# set -g status-right "#(yes '∂ßΩπ' | tr -d '\n' | cut -c \$((\$(date +%s) % 4 + 1))- | head -c 10 | sed 's/./& /g') • #[fg=yellow]%H:%M "
# set -g status-right "#(curl https://open.iciba.com/dsapi/ | jq '.content') • #[fg=yellow]%H:%M" 

set -g status-interval 1
# set -as terminal-overrides ",*:U8=0"
set -g message-style 'fg=themeblack,bg=themegreen'
# pi agent status (bridge: apps/pi/agent/extensions/tmux-status)
# @pi_status: idle | working | blocked | done | error
setw -g window-status-current-format ' #[fg=themewhite,bold]>#I:#W#{?#{==:#{@pi_status},working}, #[fg=themeyellow]●,}#{?#{==:#{@pi_status},blocked}, #[fg=themered]◆,}#{?#{==:#{@pi_status},done}, #[fg=themegreen]✔,}#{?#{==:#{@pi_status},error}, #[fg=themered,bold]✘,} '
setw -g window-status-current-style 'underscore'
setw -g window-status-style 'fg=themelightgrey'
setw -g window-status-format ' #I:#W#{?#{==:#{@pi_status},working}, #[fg=themeyellow]●,}#{?#{==:#{@pi_status},blocked}, #[fg=themered]◆,}#{?#{==:#{@pi_status},done}, #[fg=themegreen]✔,}#{?#{==:#{@pi_status},error}, #[fg=themered,bold]✘,} '
setw -g window-status-bell-style 'fg=themered'

# Copy mode highlight
set -g mode-style 'fg=themeblack,bg=themeblue'

# Re-derive the palette when a client switches light/dark or attaches, so
# editing the Ghostty theme only needs a new/unattached tmux client.
set-hook -g client-light-theme 'run-shell -b "~/.shell/tools/ghostty-tmux-theme.py"'
set-hook -g client-dark-theme  'run-shell -b "~/.shell/tools/ghostty-tmux-theme.py"'
set-hook -g client-attached    'run-shell -b "~/.shell/tools/ghostty-tmux-theme.py"'

# macOS system clipboard
if-shell 'test "$(uname)" = "Darwin"' {
    set-option -g set-clipboard off
    bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
    bind-key -T copy-mode-vi y send-keys -X copy-pipe "pbcopy"
}
# linux system clipboard
if-shell 'test "$(uname)" = "Linux"' {
    set-option -g set-clipboard external
    # only available in tmux 3.2+
    set -s copy-command 'xsel -ib'
}
bind-key -T copy-mode-vi v send-keys -X begin-selection
# bind-key -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
unbind-key -T copy-mode-vi MouseDragEnd1Pane

# Mouse scroll speed
bind-key -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Bindings
# Use C-b C-b... to active as C-b...
bind-key -r C-b send-keys C-b
bind-key -r C-f send-keys C-f
# Use C-b C-n to display panes
bind-key C-n next-window
# Reload config
bind-key r source-file ~/.tmux.conf\; display "Configuration reloaded!"
# Resize Pane
bind-key -r -T prefix       C-K              resize-pane -U 5
bind-key -r -T prefix       C-J              resize-pane -D 5
bind-key -r -T prefix       C-H              resize-pane -L 5
bind-key -r -T prefix       C-L              resize-pane -R 5

# compat for pi
set -g extended-keys on
set -g extended-keys-format csi-u
