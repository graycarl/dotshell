<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* INLINE:ask-page.css */
</style>
</head>
<body data-page-id="{{PAGE_ID}}">

<header class="ap-head">
  <div class="ap-eyebrow">ask-page</div>
  <h1>{{TITLE}}</h1>
  <p class="ap-sub">想指出问题，就点正文里带下划线的段落写批注。写完后点「复制结果」，确认预览内容后粘回对话。</p>
  <div class="ap-meta">
    <span data-ap-status>草稿保存在本机浏览器，刷新不会丢</span>
    <button type="button" class="ap-link" data-ap-reload>↻ 载入最新内容</button>
    <span>⌘/Ctrl + Enter 复制结果</span>
  </div>
</header>

<div class="ap-layout">
  <main id="ap-content">
{{CONTENT}}
  </main>

  <aside class="ap-side">
    <div class="ap-panel">
      <div class="ap-panel-head">批注 <span class="ap-count"><span data-ap-count>0</span> 条</span></div>
      <div data-ap-comments></div>
    </div>
  </aside>
</div>

<footer class="ap-bar">
  <div class="ap-bar-in">
    <div class="ap-bar-left">
      <button type="button" class="ap-btn ghost" data-ap-clear>清空全部批注</button>
    </div>
    <div class="ap-bar-right">
      <span class="ap-lbl">复制后粘回对话</span>
      <button type="button" class="ap-btn primary" data-ap-copy>复制结果</button>
    </div>
  </div>
</footer>

<div class="ap-pop" data-ap-pop hidden>
  <div class="ap-pop-head">
    <span class="ap-pop-status" data-ap-pop-status>已复制到剪贴板</span>
    <button type="button" class="ap-pop-close" data-ap-close aria-label="关闭">×</button>
  </div>
  <pre class="ap-pop-body" data-ap-pop-body></pre>
  <div class="ap-pop-foot">
    <span data-ap-pop-note>粘回对话即可</span>
    <button type="button" class="ap-btn" data-ap-copy>再复制一次</button>
  </div>
</div>

<script>
/* INLINE:ask-page.js */
</script>
</body>
</html>
