<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
/* INLINE:ask-page.css */
</style>
</head>
<body data-page-id="{{PAGE_ID}}">

<div class="ap-banner" data-ap-banner>
  <span class="ap-banner-text" data-ap-banner-text></span>
  <button type="button" class="ap-btn" data-ap-copy>再次复制</button>
  <button type="button" class="ap-btn ghost" data-ap-dismiss>收起</button>
</div>

<header class="ap-head">
  <div class="ap-eyebrow">ask-page</div>
  <h1>{{TITLE}}</h1>
  <p class="ap-sub">读完在底部给个结论；想具体指出问题，就点正文里带下划线的段落写批注。写完后点「复制结果」，把结果粘回对话。</p>
  <div class="ap-meta">
    <span data-ap-status>草稿保存在本机浏览器，刷新不会丢</span>
    <button type="button" class="ap-link" data-ap-reload>↻ 载入最新内容</button>
    <span>⌘/Ctrl + Enter 复制结果</span>
  </div>
</header>

<div class="ap-layout">
  <main id="ap-content">
{{CONTENT}}
  </main>

  <aside class="ap-side">
    <div class="ap-panel">
      <div class="ap-panel-head">批注 <span class="ap-count"><span data-ap-count>0</span> 条</span></div>
      <div data-ap-comments></div>
      <div class="ap-panel-foot">
        <button type="button" class="ap-btn ghost" data-ap-clear>清空全部</button>
      </div>
    </div>
  </aside>
</div>

<footer class="ap-bar">
  <div class="ap-bar-in">
    <div class="ap-bar-left">
      <span class="ap-lbl">结论</span>
      <div data-pi-choice="decision" data-pi-options="approve,revise,reject" data-pi-labels="通过 | 需要修改 | 否决"></div>
    </div>
    <div class="ap-bar-right">
      <span class="ap-lbl">复制后粘回对话</span>
      <button type="button" class="ap-btn primary" data-ap-copy>复制结果</button>
    </div>
  </div>
</footer>

<div class="ap-overlay" data-ap-overlay>
  <div class="ap-modal">
    <h2>浏览器拦住了自动复制</h2>
    <p>下面的内容已经全选，按 ⌘C / Ctrl+C 复制，然后粘到对话里。</p>
    <textarea readonly spellcheck="false"></textarea>
    <div class="ap-modal-actions">
      <button type="button" class="ap-btn" data-ap-close>关闭</button>
    </div>
  </div>
</div>

<script>
/* INLINE:ask-page.js */
</script>
</body>
</html>
